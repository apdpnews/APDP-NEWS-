<!DOCTYPE html><html lang='hi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>APDP न्यूज़ — ताज़ा खबरें, वीडियो</title><meta name='description' content='APDP NEWS — खबरें, वीडियो और ब्रेकिंग न्यूज़'><meta name='theme-color' content='#c8102e'><link rel='manifest' href='manifest.webmanifest'><link rel='icon' href='icon-192.png'><link rel='apple-touch-icon' href='icon-192.png'><meta name='apple-mobile-web-app-capable' content='yes'><style>
.apdp{font-family:var(--kimi-font-sans);color:var(--kimi-color-text-primary);max-width:560px;margin:0 auto;padding-bottom:76px;--kimi-color-text-primary:#17181c;--kimi-color-text-secondary:#4b4e57;--kimi-color-text-tertiary:#8a8e99;--kimi-color-text-quaternary:#b8bcc6;--kimi-color-surface:#ffffff;--kimi-color-surface-muted:#f4f5f7;--kimi-color-surface-raised:#ffffff;--kimi-color-surface-strong:#eceef1;--kimi-color-border:#e3e5ea;--kimi-color-danger:#c8102e;--kimi-color-positive:#30a46c;--kimi-color-warning:#f5a524;--kimi-color-accent:#3e63dd;--kimi-chart-1:#3e63dd;--kimi-chart-2:#c8102e;--kimi-chart-3:#30a46c;--kimi-chart-4:#8e4ec6;--kimi-chart-5:#8a8e99;--t-fast:.12s;--ease-out:cubic-bezier(.16,1,.3,1)}
.apdp.dark{--kimi-color-text-primary:#f2f3f5;--kimi-color-text-secondary:#c3c6cd;--kimi-color-text-tertiary:#8a8e99;--kimi-color-text-quaternary:#62666f;--kimi-color-surface:#17181c;--kimi-color-surface-muted:#222328;--kimi-color-surface-raised:#1e1f24;--kimi-color-surface-strong:#2c2e34;--kimi-color-border:#33353b}
.apdp *{box-sizing:border-box}
.apdp button,.apdp input,.apdp select,.apdp textarea{font:inherit}
.hd{display:flex;align-items:center;gap:8px;padding:4px 0 10px}
.hd img{width:34px;height:34px;border-radius:8px}
.logo{font-size:19px;font-weight:500}
.logo b{font-weight:500;color:var(--kimi-color-danger)}
.live{font-size:11px;font-weight:500;color:#fff;background:var(--kimi-color-danger);padding:2px 8px;border-radius:5px}
.clock{margin-left:auto;font-size:11px;color:var(--kimi-color-text-tertiary);font-variant-numeric:tabular-nums}
.ibtn{border:1px solid var(--kimi-color-border);background:var(--kimi-color-surface);color:var(--kimi-color-text-secondary);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;flex:none}
.tk{display:flex;align-items:center;gap:12px;border-top:1px solid var(--kimi-color-border);border-bottom:1px solid var(--kimi-color-border);padding:6px 0;overflow:hidden}
.tk-lab{font-size:12px;font-weight:500;color:#fff;background:var(--kimi-color-danger);padding:2px 8px;border-radius:5px;white-space:nowrap}
.tk-vw{overflow:hidden;flex:1}
.tk-trk{display:inline-block;white-space:nowrap;animation:tkm 24s linear infinite;font-size:13px;color:var(--kimi-color-text-secondary)}
@keyframes tkm{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.srch{padding:10px 0 2px}
.tabs{display:flex;gap:4px;padding:8px 0 2px;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--kimi-color-text-tertiary);font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab.on{color:#fff;background:var(--kimi-color-danger)}
.card{border:1px solid var(--kimi-color-border);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--kimi-color-surface)}
.ncard{border-bottom:1px solid var(--kimi-color-border);padding:12px 0;cursor:pointer}
.med{border-radius:8px;overflow:hidden;margin-bottom:8px;background:var(--kimi-color-surface-muted);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative}
.med img,.med video{width:100%;height:100%;object-fit:cover;display:block}
.med iframe{width:100%;height:100%;border:0}
.ph{color:var(--kimi-color-text-quaternary);font-size:42px;font-weight:500}
.bk{position:absolute;top:8px;left:8px;font-size:11px;font-weight:500;color:#fff;background:var(--kimi-color-danger);padding:2px 8px;border-radius:5px}
.sch{position:absolute;top:8px;right:8px;font-size:11px;font-weight:500;color:#fff;background:var(--kimi-color-warning);padding:2px 8px;border-radius:5px}
.nttl{font-size:17px;font-weight:500;line-height:23px;margin:8px 0 4px}
.nmeta{display:flex;align-items:center;gap:8px}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:5px;background:color-mix(in srgb,var(--cat) 13%,transparent);color:var(--cat);display:inline-flex;align-items:center;gap:6px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--cat);display:inline-block}
.tm{font-size:12px;color:var(--kimi-color-text-quaternary);margin-left:auto;font-variant-numeric:tabular-nums}
.back{border:1px solid var(--kimi-color-border);background:var(--kimi-color-surface);color:var(--kimi-color-text-secondary);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;margin-bottom:12px}
.atitle{font-size:22px;font-weight:500;line-height:29px;margin:8px 0 6px}
.abyline{font-size:13px;color:var(--kimi-color-text-tertiary);margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.adesc{font-size:15px;color:var(--kimi-color-text-secondary);line-height:23px;margin:12px 0 0;font-weight:500}
.afull{font-size:15px;color:var(--kimi-color-text-secondary);line-height:24px;margin:10px 0 0;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--kimi-color-border);padding-top:10px}
.abtn{border:0;background:transparent;color:var(--kimi-color-text-tertiary);font-size:13px;cursor:pointer;padding:5px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.abtn.liked{color:var(--kimi-color-danger)}
.rowdel{opacity:0;transition:opacity var(--t-fast) var(--ease-out);border:0;background:transparent;color:var(--kimi-color-text-quaternary);cursor:pointer;font-size:12px;padding:4px}
.card:hover .rowdel,.card:focus-within .rowdel{opacity:1}
.empty{border:1px dashed var(--kimi-color-border);border-radius:12px;padding:32px 16px;text-align:center;color:var(--kimi-color-text-tertiary);font-size:14px}
.fld{margin-bottom:12px}
.lbl{font-size:13px;font-weight:500;display:block;margin-bottom:4px}
.inp,.sel,.txa{width:100%;border:1px solid var(--kimi-color-border);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--kimi-color-surface);color:var(--kimi-color-text-primary)}
.txa{min-height:80px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;background:var(--kimi-color-danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--kimi-color-text-secondary);border:1px solid var(--kimi-color-border)}
.note{font-size:12px;color:var(--kimi-color-text-tertiary);line-height:18px}
.toast{border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;background:color-mix(in srgb,var(--kimi-color-positive) 14%,transparent);color:var(--kimi-color-positive)}
.terr{border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;background:color-mix(in srgb,var(--kimi-color-danger) 12%,transparent);color:var(--kimi-color-danger)}
.vtag{font-size:11px;color:var(--kimi-color-text-tertiary)}
.adslot{border:1px dashed var(--kimi-color-border);border-radius:10px;padding:12px;text-align:center;color:var(--kimi-color-text-quaternary);font-size:12px;margin:12px 0}
.sect{font-size:16px;font-weight:500;margin:20px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--kimi-color-danger);display:inline-block}
.rrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--kimi-color-border);cursor:pointer}
.rthumb{width:112px;height:76px;border-radius:8px;overflow:hidden;background:var(--kimi-color-surface-muted);flex:none;position:relative}
.rthumb img,.rthumb video{width:100%;height:100%;object-fit:cover;display:block}
.rph{color:var(--kimi-color-text-quaternary);font-size:26px;font-weight:500}
.rgrow{flex:1;min-width:0}
.rttl{font-size:14px;font-weight:500;line-height:19px}
.rmeta{font-size:11px;color:var(--kimi-color-text-quaternary);margin-top:4px}
.rbk{position:absolute;top:4px;left:4px;font-size:10px;font-weight:500;color:#fff;background:var(--kimi-color-danger);padding:1px 6px;border-radius:4px}
.drow{display:flex;align-items:center;gap:8px;border:1px solid var(--kimi-color-border);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.drow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--kimi-color-surface);border-top:1px solid var(--kimi-color-border);z-index:50;padding:6px 0 calc(6px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.bnav button{flex:1;border:0;background:none;color:var(--kimi-color-text-tertiary);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer;font-weight:500}
.bnav button.on{color:var(--kimi-color-danger)}
.bnav .ic{font-size:20px}
.fab{position:fixed;bottom:84px;right:12px;border:0;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500;cursor:pointer;background:var(--kimi-color-text-primary);color:var(--kimi-color-surface);box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9}
body{background:#fafafa;margin:0;padding:12px 12px 0}@media(prefers-color-scheme:dark){body{background:#101114}}</style></head><body>

function toast(m,err){$("#toast").innerHTML='<div class="'+(err?"terr":"toast")+'">'+esc(m)+'</div>';setTimeout(()=>$("#toast").innerHTML="",3500);}
function chip(p){return '<span class="chip" style="--cat:'+(CATS[p.cat]||"var(--kimi-chart-5)")+'"><i></i>'+esc(p.cat)+'</span>';}
function mediaBig(p){const yt=p.yt?'<iframe src="https://www.youtube-nocookie.com/embed/'+p.yt+'" allowfullscreen loading="lazy"></iframe>':null;
  if(yt)return '<div class="med">'+yt+'</div>';
  if(p.vurl)return '<div class="med"><video controls playsinline preload="metadata" src="'+p.vurl+'"></video></div>';
  if(p.iurl)return '<div class="med"><img src="'+p.iurl+'" loading="lazy" alt=""></div>';
  return '<div class="med"><img src="'+LOGB64+'" style="width:88px;height:88px;object-fit:contain;border-radius:12px" alt=""></div>';}
function thumb(p){if(p.yt)return '<img src="https://i.ytimg.com/vi/'+p.yt+'/mqdefault.jpg" loading="lazy" alt="">';
  if(p.iurl)return '<img src="'+p.iurl+'" loading="lazy" alt="">';
  if(p.vurl)return '<video src="'+p.vurl+'" preload="metadata" muted></video>';
  return '<span class="rph">'+esc((p.cat||"न")[0])+'</span>';}
function cardHTML(p){
  return '<article class="ncard" data-open="'+p.id+'">'+mediaBig(p).replace('<div class="med">',(p.breaking?'<div class="med"><span class="bk">ब्रेकिंग</span>':'<div class="med">')+(p.publishAt&&p.publishAt>now()?'<span class="sch">शेड्यूल्ड</span>':''))+
  '<h3 class="nttl">'+esc(p.title)+'</h3>'+
  '<div class="nmeta">'+chip(p)+((p.yt||p.vurl)?'<span class="vtag">वीडियो</span>':'')+'<span class="tm">'+ago(p.time)+' · 👁 '+(p.views||0)+'</span></div></article>';}
function rrow(p){return '<div class="rrow" data-open="'+p.id+'"><div class="rthumb">'+thumb(p)+(p.breaking?'<span class="rbk">ब्रेकिंग</span>':'')+'</div><div class="rgrow"><div class="rttl">'+esc(p.title)+'</div><div class="rmeta">'+esc(p.cat)+' · '+ago(p.time)+' · 👁 '+(p.views||0)+'</div></div></div>';}
function visiblePosts(){const q=($("#q").value||"").trim().toLowerCase();
  return posts.filter(p=>!(p.publishAt&&p.publishAt>now()))
    .filter(p=>!curCat||p.cat===curCat)
    .filter(p=>!q||((p.title||"")+(p.desc||"")+((p.full)||"")).toLowerCase().includes(q))
    .sort((a,b)=>b.time-a.time);}
function render(){
  const list=visiblePosts();
  $("#v-home").innerHTML=list.length?list.map(cardHTML).join(""):'<div class="empty">इस श्रेणी में कोई खबर नहीं।</div>';
  const vids=list.filter(p=>p.yt||p.vurl);
  let yt="";
  if(ytCache&&ytCache.length)yt='<div class="sect">हमारे YouTube वीडियो</div>'+ytCache.map(v=>'<article class="ncard" data-yt="'+v.id+'"><div class="med"><iframe src="https://www.youtube-nocookie.com/embed/'+v.id+'" allowfullscreen loading="lazy"></iframe></div><h3 class="nttl" style="font-size:15px">'+esc(v.title)+'</h3></article>').join("");
  $("#v-video").innerHTML=(vids.length?'<div class="sect">खबरों के वीडियो</div>'+vids.map(cardHTML).join(""):'<div class="empty">अभी कोई वीडियो नहीं।</div>')+yt;
  ticker();bindCards();}
function showArticle(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(curTab!=="article")histTab=curTab;
  curTab="article";
  ["home","video","adm"].forEach(k=>$("#v-"+k).hidden=true);
  const a=$("#v-article");a.hidden=false;
  const rel=posts.filter(x=>x.id!==id&&!(x.publishAt&&x.publishAt>now())).sort((x,y)=>(y.cat===p.cat)-(x.cat===p.cat)||y.time-x.time).slice(0,6);
  const liked=myLikes[p.id]?" liked":"";
  a.innerHTML='<button class="back" id="aback">← वापस</button>'+
   '<div class="nmeta">'+chip(p)+((p.yt||p.vurl)?'<span class="vtag">वीडियो</span>':'')+'<span class="tm">'+ago(p.time)+' · 👁 '+(p.views||0)+'</span></div>'+
   '<h1 class="atitle">'+esc(p.title)+'</h1>'+
   '<div class="abyline">✍️ '+esc(p.rep||"APDP न्यूज़ डेस्क")+(p.loc?' &nbsp;📍 '+esc(p.loc):'')+'</div>'+
   mediaBig(p)+
   (p.desc?'<p class="adesc">'+esc(p.desc)+'</p>':'')+
   (p.full?'<p class="afull">'+esc(p.full)+'</p>':'')+
   '<div class="acts"><button class="abtn'+liked+'" data-like="'+p.id+'">❤️ '+(p.likeCount||0)+'</button><button class="abtn" data-share="'+p.id+'">↗️ शेयर</button><button class="abtn" data-wa="'+p.id+'">WhatsApp</button></div>'+
   '<div class="adslot">विज्ञापन</div>'+
   '<div class="sect">संबंधित खबरें</div>'+(rel.length?rel.map(rrow).join(""):'<div class="note">कोई संबंधित खबर नहीं।</div>');
  $("#aback").onclick=goBack;
  countView(p.id);bindCards();window.scrollTo(0,0);if(history.replaceState)history.replaceState(null,"","#"+p.id);}
function goBack(){if(history.replaceState)history.replaceState(null,"",location.pathname);switchTab(histTab);}
function countView(id){const seen=JSON.parse(localStorage.getItem("apdp_seen")||"{}");if(seen[id])return;seen[id]=1;localStorage.setItem("apdp_seen",JSON.stringify(seen));const p=posts.find(x=>x.id===id);if(p)p.views=(p.views||0)+1;if(fbOk)db.ref("posts/"+id+"/views").transaction(v=>(v||0)+1).catch(()=>{});}
function bindCards(){

    else{await db.ref("likes/"+id+"/"+dev).set(true);myLikes[id]=true;if(user)db.ref("likes/"+id).once("value").then(s=>db.ref("posts/"+id+"/likeCount").set(Object.keys(s.val()||{}).length));}

  document.querySelectorAll("[data-wa]").forEach(b=>b.onclick=e=>{e.stopPropagation();const p=posts.find(x=>x.id===b.dataset.wa);const u=location.href.split("#")[0]+"#"+p.id;

function ticker(){const b=posts.filter(p=>p.breaking&&!(p.publishAt&&p.publishAt>now()));const t=$("#tk");
